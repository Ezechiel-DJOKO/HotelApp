<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fond dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hotelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fond arrondi -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGradient)"/>
  
  <!-- Petites étoiles décoratives -->
  <circle cx="80" cy="80" r="3" fill="white" opacity="0.4"/>
  <circle cx="440" cy="120" r="4" fill="white" opacity="0.5"/>
  <circle cx="400" cy="380" r="3" fill="white" opacity="0.4"/>
  <circle cx="100" cy="420" r="4" fill="white" opacity="0.5"/>
  
  <!-- Icône hôtel (bâtiment stylisé) -->
  <g transform="translate(112, 140)" filter="url(#shadow)">
    <!-- Toit -->
    <path d="M 0 60 L 144 0 L 288 60 L 288 80 L 0 80 Z" fill="url(#hotelGradient)"/>
    
    <!-- Corps du bâtiment -->
    <rect x="20" y="80" width="248" height="180" fill="url(#hotelGradient)"/>
    
    <!-- Fenêtres (3 lignes x 4 colonnes) -->
    <!-- Ligne 1 -->
    <rect x="40" y="110" width="30" height="30" fill="#1e40af" opacity="0.8"/>
    <rect x="85" y="110" width="30" height="30" fill="#1e40af" opacity="0.8"/>
    <rect x="173" y="110" width="30" height="30" fill="#1e40af" opacity="0.8"/>
    <rect x="218" y="110" width="30" height="30" fill="#1e40af" opacity="0.8"/>
    
    <!-- Ligne 2 -->
    <rect x="40" y="155" width="30" height="30" fill="#06b6d4" opacity="0.8"/>
    <rect x="85" y="155" width="30" height="30" fill="#06b6d4" opacity="0.8"/>
    <rect x="173" y="155" width="30" height="30" fill="#06b6d4" opacity="0.8"/>
    <rect x="218" y="155" width="30" height="30" fill="#06b6d4" opacity="0.8"/>
    
    <!-- Porte centrale -->
    <rect x="128" y="200" width="32" height="60" fill="#1e40af" rx="4"/>
    
    <!-- Étoile au sommet -->
    <text x="144" y="45" text-anchor="middle" fill="#fbbf24" font-size="30" font-weight="bold">★</text>
  </g>
  
  <!-- Texte HB (Hotel Benin) en bas -->
  <text x="256" y="470" 
        text-anchor="middle" 
        fill="white" 
        font-family="Arial, sans-serif" 
        font-size="52" 
        font-weight="900"
        letter-spacing="2">
    HotelBenin
  </text>
</svg>